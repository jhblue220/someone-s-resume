<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Archive</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
    }

    /* ── Envelope ── */
    #envelope {
      position: absolute;
      cursor: grab;
      user-select: none;
      touch-action: none;
      transform-origin: center center;
      z-index: 200;
      transition: filter 0.15s;
    }
    #envelope:hover { filter: brightness(1.08); }
    #envelope.grabbing { cursor: grabbing; }
    #envelope img {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* ── Scattered photos ── */
    .photo {
      position: absolute;
      cursor: pointer;
      user-select: none;
      transform-origin: center center;
      will-change: transform, left, top;
    }
    .photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    .photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background 0.18s;
    }
    .photo:hover::after { background: rgba(255,255,255,0.06); }

    /* ── Hint text ── */
    #hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.28);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 1.2s ease;
      white-space: nowrap;
    }

    /* ── Shake indicator ── */
    #shake-meter {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #shake-meter.active { opacity: 1; }
    #shake-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.5);
      background: transparent;
      transform-origin: center center;
      transition: transform 0.1s;
    }

    /* ── Lightbox ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.94);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    #lightbox.active {
      display: flex;
      animation: lb-in 0.22s ease;
    }
    @keyframes lb-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    #lightbox img {
      max-width: 88vw;
      max-height: 88vh;
      object-fit: contain;
      pointer-events: none;
    }
    #lb-close {
      position: fixed;
      top: 24px;
      right: 28px;
      color: rgba(255,255,255,0.45);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="stage">
  <div id="envelope">
    <img id="env-img" src="image/봉투_1.png" alt="envelope">
  </div>
</div>

<div id="lightbox">
  <img id="lb-img" src="" alt="">
  <span id="lb-close">esc to close</span>
</div>

<div id="hint">Click or shake to open</div>

<script>
/* ─────────────────────────────────────────────
   CONFIG
───────────────────────────────────────────── */
const PHOTO_FILES = [
  '거꾸로가 어때서_1.jpg','거꾸로가 어때서_2.jpg','거꾸로가 어때서_3.jpg',
  '거꾸로가 어때서_4.jpg','거꾸로가 어때서_5.jpg','거꾸로가 어때서_6.jpg',
  '나 좀 뽑아줘.jpg','나 좀 뽑아줘_2.jpg','너가 부럽다.jpg','너넨 왜 안자니?.jpg',
  '넘어져도 일어서야지.jpg','달려야 산다.jpg','달려야산다_2.jpg','더마시면 죽ㄱ....jpg.jpg',
  '돈을 쫓지마라.jpg','맘 편히 놀지를 못하네.jpg','으어ㅡㅓ으뭐라는거야.jpg',
  '이력서.png','자도 자는게 아니야.jpg','자연에서 뛰놀고 싶다.jpg','잠의 유혹.jpg',
  '정신차려라.jpg','집에서 일터로.jpg','하..놀러가고싶다^^.jpg','할머니의 염원.jpg',
  '훨훨 날아가자.jpg','히히.jpg'
];

const PW = 150;   // photo width
const PH = 200;   // photo height
const GRAVITY  = 0.55;
const FRICTION = 0.82;
const BOUNCE   = 0.22;
const SHAKE_SPEED_THRESHOLD = 700; // px/s
const STACK_THRESHOLD = PW * 0.72; // X-center distance that triggers stacking

/* ─────────────────────────────────────────────
   STATE
───────────────────────────────────────────── */
const stage    = document.getElementById('stage');
const envEl    = document.getElementById('envelope');
const envImg   = document.getElementById('env-img');
const lightbox = document.getElementById('lightbox');
const lbImg    = document.getElementById('lb-img');
const hint     = document.getElementById('hint');

let envW = 0, envH = 0;
let envX = window.innerWidth / 2;
let envY = window.innerHeight / 2;

let isDragging   = false;
let dragOX = 0, dragOY = 0;
let mousePts     = [];          // {x,y,t}
let isOpen       = false;
let scattered    = false;

let photos = [];                // live physics objects
let rafId  = null;

/* ─────────────────────────────────────────────
   ENVELOPE SETUP
───────────────────────────────────────────── */
function initEnvelope() {
  const maxW = Math.min(260, window.innerWidth * 0.38);
  const nat  = envImg.naturalWidth || 260;
  const natH = envImg.naturalHeight || 180;
  const scale = Math.min(1, maxW / nat);
  envW = nat * scale;
  envH = natH * scale;
  envEl.style.width  = envW + 'px';
  envEl.style.height = envH + 'px';
  envImg.style.cssText = 'width:100%;height:100%;object-fit:contain;';
  placeEnvelope();
}

function placeEnvelope() {
  envEl.style.left = (envX - envW / 2) + 'px';
  envEl.style.top  = (envY - envH / 2) + 'px';
}

envImg.addEventListener('load', initEnvelope);
if (envImg.complete) initEnvelope();

/* ─────────────────────────────────────────────
   DRAG
───────────────────────────────────────────── */
envEl.addEventListener('mousedown', e => {
  isDragging = true;
  dragOX = e.clientX - envX;
  dragOY = e.clientY - envY;
  envEl.classList.add('grabbing');
  mousePts = [];
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const nx = e.clientX - dragOX;
  const ny = e.clientY - dragOY;
  envX = nx;
  envY = ny;
  placeEnvelope();

  // 드래그 시작하는 순간 봉투_2로 전환
  if (!isOpen) {
    isOpen = true;
    envImg.src = 'image/봉투_2.png';
  }

  mousePts.push({ x: e.clientX, y: e.clientY, t: performance.now() });
  if (mousePts.length > 12) mousePts.shift();

  if (!scattered) checkShake();
});

document.addEventListener('mouseup', e => {
  if (!isDragging) return;
  isDragging = false;
  envEl.classList.remove('grabbing');
  mousePts = [];
});

/* ─────────────────────────────────────────────
   SHAKE DETECTION
───────────────────────────────────────────── */
function checkShake() {
  if (mousePts.length < 5) return;

  const pts = mousePts.slice(-6);
  const dt  = pts[pts.length - 1].t - pts[0].t;
  if (dt < 1) return;

  let dist = 0;
  let dirFlips = 0;
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i].x - pts[i-1].x;
    const dy = pts[i].y - pts[i-1].y;
    dist += Math.hypot(dx, dy);
    if (i >= 2) {
      const dx0 = pts[i-1].x - pts[i-2].x;
      if (dx * dx0 < -20) dirFlips++;
    }
  }

  const speed = (dist / dt) * 1000;
  if (speed > SHAKE_SPEED_THRESHOLD && dirFlips >= 1) {
    triggerScatter();
  }
}

/* ─────────────────────────────────────────────
   SCATTER
───────────────────────────────────────────── */
function triggerScatter() {
  if (scattered) return;
  scattered = true;
  isOpen = true;
  envImg.src = 'image/봉투_2.png';
  hint.style.opacity = '0';

  // Shuffle
  const files = [...PHOTO_FILES];
  for (let i = files.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [files[i], files[j]] = [files[j], files[i]];
  }

  // 포포퐁: 한 장씩 순서대로 튀어나오게 스태거
  files.forEach((file, i) => {
    setTimeout(() => spawnPhoto(file, i), i * 100 + Math.random() * 30);
  });

  if (!rafId) rafId = requestAnimationFrame(physicsLoop);
}

function spawnPhoto(file, zIdx) {
  const el = document.createElement('div');
  el.className = 'photo';
  el.style.width   = PW + 'px';
  el.style.height  = PH + 'px';
  el.style.zIndex  = zIdx + 1;

  const img = document.createElement('img');
  img.src = 'image/' + file;
  img.alt = file;
  img.draggable = false;
  el.appendChild(img);
  stage.appendChild(el);

  // 포포퐁: 위쪽으로 튀어나오되 좌우로 자연스럽게 퍼짐
  const spread = (Math.random() - 0.5) * Math.PI * 0.75;
  const spd    = 14 + Math.random() * 8;
  const vx     = Math.sin(spread) * spd * 0.55;
  const vy     = -(spd + 1 + Math.random() * 3);

  const p = {
    el, file,
    x:    envX + (Math.random() - 0.5) * 60,
    y:    envY - envH * 0.35,
    vx, vy,
    rot:  (Math.random() - 0.5) * 28,
    rotV: (Math.random() - 0.5) * 4,
    landed: false,
    zIdx
  };
  photos.push(p);

  el.addEventListener('click', () => {
    if (!p.landed) return;
    openLightbox(file);
  });
}

/* ─────────────────────────────────────────────
   EFFECTIVE FLOOR per photo
   Returns the Y-center where p should rest:
   either the hard floor or the top of the
   tallest landed photo whose X overlaps p.
───────────────────────────────────────────── */
function getEffectiveFloor(p) {
  const hardFloor = window.innerHeight - PH / 2 - 10;
  let best = hardFloor;

  for (const q of photos) {
    if (q === p || !q.landed) continue;
    if (Math.abs(p.x - q.x) < STACK_THRESHOLD) {
      const candidate = q.y - PH - 1;
      if (candidate < best) best = candidate;
    }
  }
  return best;
}

/* ─────────────────────────────────────────────
   PHYSICS LOOP — 실시간 중력 + 스택 충돌
───────────────────────────────────────────── */
function physicsLoop() {
  let allDone = photos.length > 0;

  for (const p of photos) {
    if (p.landed) continue;
    allDone = false;

    p.vy  += GRAVITY;
    p.x   += p.vx;
    p.y   += p.vy;
    p.rot += p.rotV;
    p.rotV *= 0.972;
    p.vx   *= 0.994;

    const floor = getEffectiveFloor(p);

    if (p.y >= floor) {
      p.y   = floor;
      p.vy *= -BOUNCE;
      p.vx *= FRICTION;
      p.rotV *= 0.42;
      if (Math.abs(p.vy) < 0.85 && Math.abs(p.vx) < 0.35) {
        p.vy = 0; p.vx = 0; p.rotV = 0;
        p.landed = true;
      }
    }

    // 벽 반사
    const minX = PW / 2, maxX = window.innerWidth - PW / 2;
    if (p.x < minX) { p.x = minX; p.vx =  Math.abs(p.vx) * 0.4; }
    if (p.x > maxX) { p.x = maxX; p.vx = -Math.abs(p.vx) * 0.4; }
    if (p.y < PH / 2) { p.y = PH / 2; p.vy = Math.abs(p.vy) * 0.25; }

    p.el.style.left      = (p.x - PW / 2) + 'px';
    p.el.style.top       = (p.y - PH / 2) + 'px';
    p.el.style.transform = `rotate(${p.rot}deg)`;
  }

  if (allDone) { rafId = null; return; }
  rafId = requestAnimationFrame(physicsLoop);
}

/* ─────────────────────────────────────────────
   LIGHTBOX
───────────────────────────────────────────── */
function openLightbox(file) {
  lbImg.src = 'image/' + file;
  lightbox.classList.add('active');
}

lightbox.addEventListener('click', closeLightbox);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});

function closeLightbox() {
  lightbox.classList.remove('active');
  lbImg.src = '';
}

/* ─────────────────────────────────────────────
   HINT FADE
───────────────────────────────────────────── */
setTimeout(() => { hint.style.opacity = '0'; }, 3800);
</script>
</body>
</html>
